name: tofu

# PR            -> validate + tflint + worker tests + edge-script tests + trivy + plan (plan posted as a PR comment)
# push to main  -> validate + tflint + worker tests + edge-script tests + trivy + plan (plan saved as an artifact)
# manual run    -> apply the exact plan saved for the current main commit
#
# Manual apply is a workflow_dispatch because required reviewers on
# environments are not available for private repos on the GitHub Free plan.
#
# Credentials (repository settings -> Secrets and variables -> Actions):
#   secrets   CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables CLOUDFLARE_ACCOUNT_ID, ALLOWED_EMAILS (JSON list, the OWNER, always allowed), OTP_IDP_ID (optional),
#             APP_ACCESS and APP_ACCESS_EMAILS (JSON objects made by <home-server-repo>/access/access.py cloudflare; unset = {})
# Failure notifications are pulled by ChatOps (GitHub API), not pushed from here.
#
# Security notes for whoever owns a copy of this repository:
#   - Run it in a PRIVATE repository. The saved plan (artifact tfplan-<sha>, 7 days) is a binary file that can hold
#     values the provider marks sensitive, and a pull-request comment shows the plan text.
#   - Cloudflare has no keyless login: the plan job of a pull request from a BRANCH of this repository holds the API token
#     and the R2 keys, and anyone with WRITE access can edit this workflow in that branch and read them. So: (1) give write
#     access to nobody you do not trust; (2) set the OPTIONAL secrets CLOUDFLARE_API_TOKEN_PLAN (a token with Read access
#     only, README) so the plan job never holds the edit token; the apply job always uses CLOUDFLARE_API_TOKEN and only
#     runs manually on main. Fork pull requests get no secrets and no plan job.
#   - ZONE_NAME (variable): your domain, no default.
#
# The push that creates a repo's first branch never starts this workflow, whatever
# it contains (GitHub does not evaluate the paths filter there): the next push that
# touches one of the paths below starts the first plan.

on:
  pull_request:
    paths:
      - "infra/**"
      - "workers/**"
      - "scripts/**"
      - ".tflint.hcl"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "workers/**"
      - "scripts/**"
      - ".tflint.hcl"
      - ".github/workflows/tofu.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to apply the plan saved for the latest main commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One state-touching run at a time on main; PRs queue per branch.
  group: tofu-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.13.9
  TRIVY_VERSION: v0.76.2
  TFLINT_VERSION: v0.66.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate
        run: |
          tofu -chdir=infra init -backend=false -lockfile=readonly
          tofu -chdir=infra validate

      # Offline wiring checks with a mocked provider (infra/tests/).
      - name: tofu test
        run: tofu -chdir=infra test

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the plugin
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  worker-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      # Node from the runner image; the tests use only node:test (no npm install).
      - name: failover worker unit tests
        working-directory: workers/failover
        run: node --test

  edge-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      # Python from the runner image; stdlib only, fake HTTP/sockets (no network).
      - name: verify-edge.py unit tests
        working-directory: scripts
        run: python3 -m unittest -v test_verify_edge

  trivy:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      # Pinned by commit: trivy-action tags were hijacked in March 2026 (CVE-2026-33634).
      - name: trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  plan:
    needs: [validate, worker-tests, edge-tests, trivy]
    # Fork pull requests never reach a cloud login: this job (the only one with credentials on a pull request)
    # is skipped for them, and in a repository that is not configured yet (no CLOUDFLARE_ACCOUNT_ID variable).
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_r2_location: ${{ vars.R2_LOCATION || 'weur' }}
      TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}
      TF_VAR_otp_idp_id: ${{ vars.OTP_IDP_ID }}
      # Per-app lists made by <home-server-repo>/access/access.py. An unset variable is an empty string, which tofu cannot parse as JSON: fall back to {}.
      TF_VAR_app_access: ${{ vars.APP_ACCESS || '{}' }}
      TF_VAR_app_access_emails: ${{ vars.APP_ACCESS_EMAILS || '{}' }}
      # Optional read-only token for the plan (README): falls back to the edit token while it is not set.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN || secrets.CLOUDFLARE_API_TOKEN }}
      # The s3 backend reads the R2 S3 API keys from the AWS_* variables.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check settings
        run: |
          missing=""
          [ -n "$TF_VAR_account_id" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          [ -n "$TF_VAR_allowed_emails" ] || missing="$missing ALLOWED_EMAILS(variable)"
          [ -n "$TF_VAR_zone_name" ] || missing="$missing ZONE_NAME(variable)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing R2_ACCESS_KEY_ID(secret)"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing R2_SECRET_ACCESS_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing (see docs/WHAT-YOU-DO.md)"; exit 1
          fi

      # The R2 endpoint contains the account id, so it is passed here instead
      # of being written in infra/backend.tf.
      - name: tofu init
        run: |
          tofu -chdir=infra init -lockfile=readonly \
            -backend-config="endpoints={s3=\"https://${TF_VAR_account_id}.r2.cloudflarestorage.com\"}"

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu -chdir=infra plan -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          tofu -chdir=infra show -no-color tfplan > plan.txt
          {
            echo "## OpenTofu plan"
            echo '```'
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo '```'
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tofu-plan -->';
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see run)'])[0];
            const body = [
              marker,
              `### OpenTofu plan: ${summary}`,
              `Commit ${context.sha.slice(0, 7)}, [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '<details><summary>Full plan</summary>',
              '',
              '```hcl',
              plan.slice(0, 60000),
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Save plan for manual apply
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: |
            infra/tfplan
            plan.txt
          retention-days: 7
          if-no-files-found: error
          overwrite: true # a re-run of the same commit replaces its plan

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_r2_location: ${{ vars.R2_LOCATION || 'weur' }}
      TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}
      TF_VAR_otp_idp_id: ${{ vars.OTP_IDP_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The s3 backend reads the R2 S3 API keys from the AWS_* variables.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Apply only runs from main (got $GITHUB_REF)"; exit 1
          fi
          if [ "$CONFIRM" != "apply" ]; then
            echo '::error::Type "apply" in the confirm box to apply'; exit 1
          fi

      - name: Find the plan run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tofu.yml \
            --branch main --event push --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful plan for $GITHUB_SHA. Push to main (or re-run its workflow) first, wait for it to pass, then apply."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Applying plan from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes: no token left in .git/config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check settings
        run: |
          missing=""
          [ -n "$TF_VAR_account_id" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          [ -n "$TF_VAR_allowed_emails" ] || missing="$missing ALLOWED_EMAILS(variable)"
          [ -n "$TF_VAR_zone_name" ] || missing="$missing ZONE_NAME(variable)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing R2_ACCESS_KEY_ID(secret)"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing R2_SECRET_ACCESS_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing (see docs/WHAT-YOU-DO.md)"; exit 1
          fi

      # The R2 endpoint contains the account id, so it is passed here instead
      # of being written in infra/backend.tf.
      - name: tofu init
        run: |
          tofu -chdir=infra init -lockfile=readonly \
            -backend-config="endpoints={s3=\"https://${TF_VAR_account_id}.r2.cloudflarestorage.com\"}"

      # OpenTofu refuses a saved plan if the state changed after it was made.
      - name: tofu apply
        run: |
          {
            echo "## Applied plan"
            echo '```'
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tofu -chdir=infra apply -lock-timeout=5m tfplan

      - name: Outputs
        run: |
          {
            echo "## Outputs"
            echo '```'
            tofu -chdir=infra output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
